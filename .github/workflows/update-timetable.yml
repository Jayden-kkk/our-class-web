name: Auto Update Comcigan Timetable

on:
  schedule:
    # 매일 KST 07:30, 12:30, 18:30, 23:30 (UTC 22:30, 03:30, 09:30, 14:30) 자동 동기화
    - cron: "30 3,9,14,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-timetable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch latest timetable from Comcigan
        run: node scripts/update-timetable.js

      - name: Commit and push if timetable changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add timetable-data.json
          if git diff --staged --quiet; then
            echo "변경된 시간표 데이터가 없습니다."
          else
            git commit -m "chore: auto-update timetable-data.json"
            git push
          fi
